name: Storyspace backend checks
on:
  push:
    branches: [product/storyspace-platform]
    paths: ['NETFLIX/platform-backend/**']
  pull_request:
    paths: ['NETFLIX/platform-backend/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NETFLIX/platform-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
