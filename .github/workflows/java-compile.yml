name: Java compile check

on:
  push:
    branches:
      - main
      - polish/netflix-java-sync
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        java-version: [8, 17]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Compile project
        working-directory: NETFLIX
        run: javac *.java
      - name: Run smoke tests
        working-directory: NETFLIX
        run: java NETFLIX_SMOKE_TEST
      - name: Check frontend JavaScript syntax
        run: node --check NETFLIX/web/app.js
      - name: Clean compiled files
        if: always()
        run: find NETFLIX -name '*.class' -delete
