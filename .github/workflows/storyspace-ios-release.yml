name: Storyspace iOS Signed IPA

on:
  workflow_dispatch:
    inputs:
      confirm_signed_build:
        description: Confirm Apple signing secrets are configured and generate a signed IPA artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signed-ipa:
    if: inputs.confirm_signed_build == true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate signing configuration
        env:
          IOS_CERTIFICATE_P12_BASE64: \${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: \${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: \${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: \${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID; do
            if [ -z "\${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install Apple signing certificate and profile
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: \${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: \${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: \${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: \${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/storyspace-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/storyspace-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/storyspace.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/storyspace-profile.plist"

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")

          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile TeamIdentifier does not match APPLE_TEAM_ID."
            exit 1
          fi
          case "$APP_IDENTIFIER" in
            *".io.storyspace.app"|*".*" ) ;;
            *) echo "::error::Provisioning profile is not compatible with io.storyspace.app."; exit 1 ;;
          esac

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::error::No Apple Distribution signing identity found in the supplied certificate."
            exit 1
          fi

      - name: Install Capacitor dependencies
        working-directory: STORYSPACE/platforms/mobile
        run: npm install

      - name: Generate iOS project
        working-directory: STORYSPACE/platforms/mobile
        run: npx cap add ios

      - name: Configure API endpoint
        working-directory: STORYSPACE/platforms/mobile
        env:
          STORYSPACE_API_ROOT: \${{ vars.STORYSPACE_API_ROOT }}
        run: node configure-api-root.js

      - name: Sync web assets and native plugins
        working-directory: STORYSPACE/platforms/mobile
        run: npx cap sync ios

      - name: Archive signed iOS app
        working-directory: STORYSPACE/platforms/mobile
        env:
          APPLE_TEAM_ID: \${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: \${{ steps.signing.outputs.profile_name }}
          KEYCHAIN_PATH: \${{ steps.signing.outputs.keychain_path }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Storyspace.xcarchive -derivedDataPath build \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER="io.storyspace.app" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" archive

      - name: Export signed IPA
        working-directory: STORYSPACE/platforms/mobile
        env:
          APPLE_TEAM_ID: \${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: \${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Storyspace-ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>io.storyspace.app</key><string>$IOS_PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Storyspace.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/Storyspace-ExportOptions.plist" \
            -exportPath build/Storyspace-IPA

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: storyspace-ios-signed-ipa
          path: STORYSPACE/platforms/mobile/build/Storyspace-IPA/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: \${{ steps.signing.outputs.keychain_path }}
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/storyspace-distribution.p12" "$RUNNER_TEMP/storyspace.mobileprovision" "$RUNNER_TEMP/storyspace-profile.plist"
