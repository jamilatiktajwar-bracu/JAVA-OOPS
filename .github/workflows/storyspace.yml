name: Storyspace checks
on:
  push:
    branches: [product/storyspace-platform, product/multiplatform-foundation]
    paths: ['STORYSPACE/**','.github/workflows/storyspace.yml','.github/workflows/storyspace*.yml']
  pull_request:
    paths: ['STORYSPACE/**','.github/workflows/storyspace.yml','.github/workflows/storyspace*.yml']
# Avoid spending runner minutes on superseded commits from the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: STORYSPACE/backend/pom.xml
      - name: Backend tests
        run: mvn -B test
        working-directory: STORYSPACE/backend
      - name: Frontend and native bridge syntax
        run: |
          node --check STORYSPACE/web/app.js
          node --check STORYSPACE/web/media-uploads.js
          node --check STORYSPACE/web/enhancements.js
          node --check STORYSPACE/web/native-bridge.js
          node --check STORYSPACE/web/sw.js
          node --check STORYSPACE/home-media/server.mjs
          node --check STORYSPACE/home-media/smoke-test.mjs
          node STORYSPACE/home-media/smoke-test.mjs
          node STORYSPACE/web/upgrade-smoke.js
      - name: Platform configuration smoke checks
        run: node STORYSPACE/platforms/check-platform-config.js

  windows-media-script-parse:
    name: Windows media PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows media host scripts
        shell: pwsh
        run: |
          $files = @(
            "STORYSPACE/home-media/Start-Storyspace-Media.ps1",
            "STORYSPACE/home-media/Upload-Movie.ps1",
            "STORYSPACE/home-media/Setup-Cloudflare-Tunnel.ps1",
            "STORYSPACE/home-media/Run-Storyspace-Tunnel.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

  postgres-migration-tests:
    name: PostgreSQL migration integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: storyspace
          POSTGRES_USER: storyspace
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storyspace -d storyspace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: STORYSPACE/backend/pom.xml
      - name: Test Flyway migration and API on PostgreSQL
        working-directory: STORYSPACE/backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/storyspace
          DATABASE_USER: storyspace
          DATABASE_PASSWORD: test-password
          JPA_DDL_AUTO: validate
          FLYWAY_ENABLED: true
          FLYWAY_BASELINE_ON_MIGRATE: false
          TOKEN_SECRET: ci-test-token-secret-with-more-than-32-characters
        run: mvn -B test
