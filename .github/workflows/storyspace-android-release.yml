name: Storyspace Android Signed AAB

on:
  workflow_dispatch:
    inputs:
      confirm_signed_build:
        description: Confirm Android signing secrets are configured and generate a signed Play Store AAB artifact
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signed-aab:
    if: inputs.confirm_signed_build == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Android signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor dependencies
        working-directory: STORYSPACE/platforms/mobile
        run: npm install

      - name: Generate Android project
        working-directory: STORYSPACE/platforms/mobile
        run: npx cap add android

      - name: Configure API endpoint
        working-directory: STORYSPACE/platforms/mobile
        env:
          STORYSPACE_API_ROOT: ${{ vars.STORYSPACE_API_ROOT }}
        run: node configure-api-root.js

      - name: Sync web assets and native plugins
        working-directory: STORYSPACE/platforms/mobile
        run: npx cap sync android

      - name: Configure Android TV launcher
        run: node STORYSPACE/platforms/android-tv/prepare-android-tv.js "$GITHUB_WORKSPACE/STORYSPACE/platforms/mobile/android"

      - name: Install Android signing key
        working-directory: STORYSPACE/platforms/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/storyspace-release.keystore"
          chmod 600 "$RUNNER_TEMP/storyspace-release.keystore"

      - name: Configure Gradle release signing
        working-directory: STORYSPACE/platforms/mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/storyspace-release.keystore
        run: node prepare-release-gradle.js android/app/build.gradle

      - name: Build signed Android App Bundle
        working-directory: STORYSPACE/platforms/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/storyspace-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify Android App Bundle signature
        working-directory: STORYSPACE/platforms/mobile/android
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/storyspace-aab-signature.txt"
          grep -q "jar verified" "$RUNNER_TEMP/storyspace-aab-signature.txt"

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: storyspace-android-signed-aab
          path: STORYSPACE/platforms/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/storyspace-release.keystore"
