name: Netflix Java CI

on:
  push:
    paths:
      - "NETFLIX/**"
      - ".github/workflows/netflix-java-ci.yml"
  pull_request:
    paths:
      - "NETFLIX/**"
      - ".github/workflows/netflix-java-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "17", "21"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile, run regression smoke tests and demo
        working-directory: NETFLIX
        run: sh smoke-test.sh
