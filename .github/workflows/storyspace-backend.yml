name: Storyspace backend checks
on:
  push:
    branches: [product/storyspace-platform]
    paths: ['NETFLIX/platform-backend/**','NETFLIX/web/**','.github/workflows/storyspace-backend.yml']
  pull_request:
    paths: ['NETFLIX/platform-backend/**','NETFLIX/web/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: NETFLIX/platform-backend/pom.xml
      - name: Test Java backend
        run: mvn -B test
        working-directory: NETFLIX/platform-backend
      - name: Check frontend syntax
        run: node --check NETFLIX/web/app.js