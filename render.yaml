services:
  - type: web
    name: storyspace-api
    runtime: docker
    dockerfilePath: STORYSPACE/backend/Dockerfile
    dockerContext: STORYSPACE/backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storyspace-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: storyspace-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: storyspace-db
          property: password
      - key: TOKEN_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: true
      - key: FLYWAY_BASELINE_ON_MIGRATE
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://localhost,capacitor://localhost,ionic://localhost

databases:
  - name: storyspace-db
    databaseName: storyspace
    user: storyspace
